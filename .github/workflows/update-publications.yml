name: Update publications from PubMed

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python3 scripts/update_publications.py

      - name: Commit changes
        run: |
          # The "updated" stamp changes on every run; only commit when the list itself changed.
          changed=$(git diff -U0 data/publications.json | grep -E '^[+-][^+-]' | grep -vc '"updated"' || true)
          if [ "$changed" = "0" ]; then
            echo "No new publications."
            git checkout -- data assets
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json assets/js/publications-data.js
          git commit -m "Update publications from PubMed"
          git push
